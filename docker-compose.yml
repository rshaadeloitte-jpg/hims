name: ihms

services:
  postgres:
    image: postgres:16-alpine
    container_name: ihms-pg
    command: ["postgres","-c","max_connections=500"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ihms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ihms-dev-only}
      POSTGRES_DB: ihms
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ihms} -d ihms"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ihms-redis
    command: ["redis-server","--appendonly","no","--maxmemory","256mb","--maxmemory-policy","allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.1
    container_name: ihms-kafka
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL","/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped


  aasmaan-service:
    image: ihms-aasmaan-service:latest
    container_name: ihms-aasmaan-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ihms
      DB_USERNAME: ${POSTGRES_USER:-ihms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ihms-dev-only}
      SPRING_PROFILES_ACTIVE: dev
      KAFKA_BOOTSTRAP: kafka:9092
      SERVER_PORT: 8112
    ports:
      - "8112:8112"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

