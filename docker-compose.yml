name: ihms
# Default `docker compose up -d` starts only the core services (about 5GB).
# Use `docker compose --profile full up -d` for the full stack (needs more than 16GB RAM).
services:
  adt-service:
    image: ihms-adt-service:latest
    container_name: ihms-adt-service
    environment: {SPRING_PROFILES_ACTIVE: dev, KAFKA_BOOTSTRAP: '10.70.233.218:9092',
      SERVER_PORT: 8092, DEV_DB_HOST: 10.68.61.102, DEV_DB_PORT: '5432', DEV_DB_NAME: hims,
      DEV_DB_USERNAME: postgres, DEV_DB_PASSWORD: TMSProduct1234, DB_HOST: 10.68.61.102,
      DB_PORT: '5432', DB_NAME: hims, DB_USERNAME: postgres, DB_PASSWORD: TMSProduct1234, IAM_JWT_SECRET: "${IAM_JWT_SECRET:-}", JAVA_TOOL_OPTIONS: '-XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=30'}
    ports: ['8092:8092']
    restart: unless-stopped
    mem_limit: 1024m
    cpus: '1.0'
    memswap_limit: 1024m
  appointment-service:
    image: ihms-appointment-service:latest
    container_name: ihms-appointment-service
    environment: {SPRING_PROFILES_ACTIVE: dev, KAFKA_BOOTSTRAP: '10.70.233.218:9092',
