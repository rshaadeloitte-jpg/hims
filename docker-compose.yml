    container_name: ihms-search-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ihms
      DB_USERNAME: ${POSTGRES_USER:-ihms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ihms-dev-only}
      SPRING_PROFILES_ACTIVE: dev
      KAFKA_BOOTSTRAP: kafka:9092
      SERVER_PORT: 8107
    ports:
      - "8107:8107"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  transport-service:
    image: ihms-transport-service:latest
    container_name: ihms-transport-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ihms
      DB_USERNAME: ${POSTGRES_USER:-ihms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ihms-dev-only}
      SPRING_PROFILES_ACTIVE: dev
      KAFKA_BOOTSTRAP: kafka:9092
      SERVER_PORT: 8086
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  waste-service:
    image: ihms-waste-service:latest
    container_name: ihms-waste-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ihms
      DB_USERNAME: ${POSTGRES_USER:-ihms}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ihms-dev-only}
      SPRING_PROFILES_ACTIVE: dev
      KAFKA_BOOTSTRAP: kafka:9092
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: ./platform/gateway
    image: ihms-api-gateway:latest
    container_name: ihms-api-gateway
    ports: ["9000:80"]
    restart: unless-stopped

  frontend:
    image: ihms-frontend:latest
    container_name: ihms-frontend
    ports: ["3000:80"]
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  pg-data:
