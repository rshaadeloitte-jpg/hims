openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Authentication
  description: 'Login (JWT issue), logout (token revoke), validate (token introspection)'
- name: Users
  description: User master CRUD and per-user role assignment
- name: Roles
  description: 'Role catalogue: list and create roles'
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/validate:
    post:
      tags:
      - Authentication
      operationId: validate
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ValidateResponse'
  /api/v1/users:
    get:
      tags:
      - Users
      operationId: list
      parameters:
      - name: unitId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: roleId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserView'
    post:
      tags:
      - Users
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserView'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/{id}:
    get:
      tags:
      - Users
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserView'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags:
      - Users
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserView'
  /api/v1/users/{id}/roles:
    put:
      tags:
      - Users
      operationId: assignRoles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRolesRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserView'
  /api/v1/roles:
    get:
      tags:
      - Roles
      operationId: list_1
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleView'
    post:
      tags:
      - Roles
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RoleView'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      properties:
        status:
          type: string
        errorCode:
          type: string
        message:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        username:
          type: string
        roles:
          type: array
          items:
            type: string
    LogoutRequest:
      type: object
      properties:
        token:
          type: string
    ValidateRequest:
      type: object
      properties:
        token:
          type: string
    ValidateResponse:
      type: object
      properties:
        valid:
          type: boolean
        username:
          type: string
        userId:
          type: integer
          format: int64
        roles:
          type: array
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        reason:
          type: string
    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 100
        password:
          type: string
          minLength: 8
          maxLength: 72
        email:
          type: string
        fullName:
          type: string
        employeeId:
          type: integer
          format: int64
        unitId:
          type: integer
          format: int64
        roleIds:
          type: array
          items:
            type: integer
            format: int64
      required:
      - password
      - username
    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        employeeId:
          type: integer
          format: int64
        unitId:
          type: integer
          format: int64
        status:
          type: boolean
    AssignRolesRequest:
      type: object
      properties:
        roleIds:
          type: array
          items:
            type: integer
            format: int64
    UserView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
        employeeId:
          type: integer
          format: int64
        unitId:
          type: integer
          format: int64
        status:
          type: boolean
        roleIds:
          type: array
          items:
            type: integer
            format: int64
        roles:
          type: array
          items:
            type: string
    CreateRoleRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 64
        description:
          type: string
        unitId:
          type: integer
          format: int64
      required:
      - code
    RoleView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        description:
          type: string
        unitId:
          type: integer
          format: int64
        status:
          type: boolean
