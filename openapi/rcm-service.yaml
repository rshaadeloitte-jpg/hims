openapi: 3.1.0
info:
  title: RCM & Claims Service (WP-R4)
  version: v0
  description: |
    Catalog #23 Wave-5 tranche 5 slice. Owns ihms_rcm: t_eligibility_check +
    t_admission_tid + t_nhcx_request(+detail). NHCX status machine SMALLINT
    0..3 per register WP-R4 (06 §A9 source block): 0=INITIATED 1=SENT
    2=ACKNOWLEDGED 3=COMPLETED/ERROR — forward-only, monotonic; re-applying the
    CURRENT status via callback is an idempotent no-op success anchored by the
    UNIQUE correlation_id; unknown correlation -> 404 envelope.
    SCOPE: HCX/NHCX external gateway calls are OUT OF SCOPE this tranche —
    requests are persisted with correlation ids and callbacks are simulated
    locally. EVENT POLICY: ClaimSubmitted is DEFERRED per KAFKA-EVENT-CATALOG §3
    — NO outbox emission; asserted empty by tests. Consumes InvoiceGenerated /
    PaymentReceived post-saga.
servers:
- url: http://localhost:8103
  description: Generated server url
tags:
- name: Coverage Eligibility (WP-R4)
  description: 'RCM & Claims (Catalog #23): coverage-eligibility checks, status 0=INITIATED 1=SENT 2=ACKNOWLEDGED 3=COMPLETED/ERROR; callbacks simulated locally (external HCX/NHCX gateway OUT OF SCOPE)'
- name: NHCX Requests (WP-R4)
  description: 'Persisted NHCX requests kind 1=COVERAGE_ELIGIBILITY 2=PRE_AUTH 3=CLAIM_SUBMIT; callback idempotent by correlation_id'
- name: Admission TID (WP-R4)
  description: 'Admission -> NHCX transaction id registry; unique per admission (409 TID_EXISTS on reassignment)'
paths:
  /api/v1/coverage-eligibility:
    post:
      tags:
      - Coverage Eligibility (WP-R4)
      operationId: createCoverageEligibility
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoverageEligibilityRequest'
        required: true
      responses:
        '201':
          description: Created (check status 0=INITIATED plus companion t_nhcx_request kind=1 with fresh correlation id); emits nothing
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EligibilityCheck'
        '400':
          description: 'Guards: patientId required; payerScheme required, max 60 chars (BEXA003)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/coverage-eligibility/{id}/response:
    put:
      tags:
      - Coverage Eligibility (WP-R4)
      operationId: recordEligibilityResponse
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadRequest'
        required: true
      responses:
        '200':
          description: Response recorded; check pinned to status 2=ACKNOWLEDGED with response_payload stored
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EligibilityCheck'
        '400':
          description: 'payload required (BEXA003); only INITIATED checks accept a response — second response -> RCM_ILLEGAL_TRANSITION'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown eligibility check id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/pre-auths:
    post:
      tags:
      - NHCX Requests (WP-R4)
      operationId: createPreAuth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreAuthRequest'
        required: true
      responses:
        '200':
          description: Persisted kind=2 PRE_AUTH request, status 0=INITIATED, fresh correlation id; payload.lines split into detail rows when present; emits nothing
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NhcxRequest'
        '400':
          description: 'Guards: patientId required; payload required (BEXA003)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/claims:
    post:
      tags:
      - NHCX Requests (WP-R4)
      operationId: createClaim
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimRequest'
        required: true
      responses:
        '200':
          description: Persisted kind=3 CLAIM_SUBMIT record, status 0=INITIATED, fresh correlation id. ClaimSubmitted event DEFERRED per KAFKA-EVENT-CATALOG §3 — no outbox write
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NhcxRequest'
        '400':
          description: 'Guards: patientId required; billId required for claim submission; payload required (BEXA003)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/nhcx/{correlationId}/callback:
    put:
      tags:
      - NHCX Requests (WP-R4)
      operationId: nhcxCallback
      parameters:
      - name: correlationId
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
        required: true
      responses:
        '200':
          description: Callback applied (forward transition) or idempotent no-op success (same status repeated); state unchanged on repeat
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NhcxRequest'
        '400':
          description: 'status must be 0..3 (BEXA003); backward/different-from-terminal transition -> RCM_ILLEGAL_TRANSITION'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown correlation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/nhcx:
    get:
      tags:
      - NHCX Requests (WP-R4)
      operationId: listNhcxRequests
      parameters:
      - name: kind
        in: query
        required: false
        description: '1..3 or name (COVERAGE_ELIGIBILITY, PRE_AUTH, CLAIM_SUBMIT)'
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: '0..3 or name (INITIATED, SENT, ACKNOWLEDGED, COMPLETED)'
        schema:
          type: string
      responses:
        '200':
          description: Filtered NHCX requests with their detail lines
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NhcxRequest'
        '400':
          description: Unknown kind or status filter value (BEXA003)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admissions/{admissionId}/tid:
    get:
      tags:
      - Admission TID (WP-R4)
      operationId: getAdmissionTid
      parameters:
      - name: admissionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The registered NHCX transaction id
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdmissionTid'
        '404':
          description: Admission carries no TID yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags:
      - Admission TID (WP-R4)
      operationId: assignAdmissionTid
      parameters:
      - name: admissionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTidRequest'
        required: true
      responses:
        '200':
          description: TID registered
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdmissionTid'
        '400':
          description: 'tid required, max 60 chars (BEXA003)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Duplicate assignment — one TID per admission (TID_EXISTS; DB backstop uq_t_admission_tid_admission)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiError:
      type: object
      properties:
        status:
          type: string
        errorCode:
          type: string
        message:
          type: string
    CreateCoverageEligibilityRequest:
      required:
      - patientId
      - payerScheme
      type: object
      properties:
        patientId:
          type: integer
          format: int64
        payerScheme:
          type: string
          maxLength: 60
    PayloadRequest:
      type: object
      properties:
        payload:
          type: object
          additionalProperties: true
    EligibilityCheck:
      type: object
      properties:
        eligibilityId:
          type: integer
          format: int64
        requestId:
          type: integer
          format: int64
          description: Companion t_nhcx_request row (kind=1)
        correlationId:
          type: string
        patientId:
          type: integer
          format: int64
        payerScheme:
          type: string
        statusCode:
          type: integer
          format: int32
          description: 'SMALLINT 0..3: 0=INITIATED 1=SENT 2=ACKNOWLEDGED 3=COMPLETED/ERROR'
        requestPayload:
          type: string
        responsePayload:
          type: string
    CreatePreAuthRequest:
      required:
      - patientId
      - payload
      type: object
      properties:
        patientId:
          type: integer
          format: int64
        admissionId:
          type: integer
          format: int64
        payload:
          type: object
          additionalProperties: true
    CreateClaimRequest:
      required:
      - patientId
      - billId
      - payload
      type: object
      properties:
        patientId:
          type: integer
          format: int64
        billId:
          type: integer
          format: int64
        payload:
          type: object
          additionalProperties: true
    CallbackRequest:
      type: object
      properties:
        payload:
          type: object
          additionalProperties: true
        status:
          type: integer
          format: int32
          description: 'Target NHCX status 0..3'
    NhcxRequestDetail:
      type: object
      properties:
        requestId:
          type: integer
          format: int64
        lineNo:
          type: integer
          format: int64
        detail:
          type: string
    NhcxRequest:
      type: object
      properties:
        requestId:
          type: integer
          format: int64
        kind:
          type: integer
          format: int32
          description: '1=COVERAGE_ELIGIBILITY 2=PRE_AUTH 3=CLAIM_SUBMIT'
        patientId:
          type: integer
          format: int64
        billId:
          type: integer
          format: int64
        admissionId:
          type: integer
          format: int64
        statusCode:
          type: integer
          format: int32
          description: 'SMALLINT 0..3: 0=INITIATED 1=SENT 2=ACKNOWLEDGED 3=COMPLETED/ERROR'
        requestPayload:
          type: string
        responsePayload:
          type: string
        correlationId:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/NhcxRequestDetail'
    AssignTidRequest:
      required:
      - tid
      type: object
      properties:
        tid:
          type: string
          maxLength: 60
    AdmissionTid:
      type: object
      properties:
        tidId:
          type: integer
          format: int64
        admissionId:
          type: integer
          format: int64
        tid:
          type: string
