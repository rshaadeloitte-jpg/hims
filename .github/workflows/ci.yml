# iHMS Modernization — CI (MIG-003, Wave 0 / slice S0)
# Container engine: Podman (project standard; docker CLI is NOT required).
# Images are pulled from docker.io (pinned tags, no floating latest).
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  DOCKER_HOST: unix:///tmp/podman.sock        # Podman docker-compat API socket
  JAVA_VERSION: "21"

jobs:
  reference-service-build-test:
    name: reference-service build + test (L0/L1/L2 via Testcontainers on Podman)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/reference-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Podman docker-compat API socket
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman version
          podman system service --time=0 unix:///tmp/podman.sock &
          for i in $(seq 1 30); do
            if curl -sf --unix-socket /tmp/podman.sock http://localhost/_ping >/dev/null 2>&1; then echo "podman socket ready"; break; fi
            sleep 1
          done
          curl -sf --unix-socket /tmp/podman.sock http://localhost/_ping

      - name: Maven verify (unit + contract + Testcontainers PG16/Kafka via Podman)
        run: mvn -B verify
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"   # rootless Podman: Ryuk cannot bind-mount the socket (IMP-DEC-028)

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: services/reference-service/target/surefire-reports/

