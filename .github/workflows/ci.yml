  platform-compose:
    name: platform compose stack (Podman, docker.io images)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Podman + compose provider
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman podman-compose curl
          podman version
          podman system service --time=0 unix:///tmp/podman.sock &
          for i in $(seq 1 30); do
            if curl -sf --unix-socket /tmp/podman.sock http://localhost/_ping >/dev/null 2>&1; then echo "podman socket ready"; break; fi
            sleep 1
          done

      - name: Validate compose file
        run: podman-compose -f docker-compose.yml config --quiet

      - name: Boot the whole platform stack and await health
        run: |
          cp .env.example .env
          podman-compose -f docker-compose.yml up -d
          podman ps --format 'table {{.Names}}\t{{.Status}}'
          # await healthchecks (PG fast; Solr slower)
          for i in $(seq 1 60); do
            summary=$(podman ps --format '{{.Names}}={{.Status}}' | tr '\n' ' ')
            echo "t+$((i*10))s: $summary"
            case "$summary" in
              *"unhealthy"*) echo "UNHEALTHY"; exit 1;;
            esac
            if ! echo "$summary" | grep -q "ihms-pg.*(healthy)"; then sleep 10; continue; fi
            if ! echo "$summary" | grep -q "ihms-solr.*(healthy)"; then sleep 10; continue; fi
            if ! echo "$summary" | grep -q "ihms-solr-zk.*(healthy)"; then sleep 10; continue; fi
            echo "ALL HEALTHY"; break
          done
          podman ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'

      - name: Tear down
        if: always()
        run: podman-compose -f docker-compose.yml down -v
