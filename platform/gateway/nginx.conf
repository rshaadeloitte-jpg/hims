server {
  listen 80;
  resolver 127.0.0.11 valid=30s;
  # default backend
  location / {
    set $backend "reference-service:8081";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    location ^~ /api/v1/users {
    set $backend "iam:8080";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
  }
