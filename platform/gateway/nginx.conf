server {
  listen 80;
  resolver 127.0.0.11 valid=30s;
  # IAM routes
  location ^~ /api/v1/users {
    set $backend "iam:8080";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
  }
  location ^~ /api/v1/auth {
    set $backend "iam:8080";
    proxy_pass http://$backend;
    proxy_set_header Host $host;
