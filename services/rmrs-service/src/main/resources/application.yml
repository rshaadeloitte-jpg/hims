spring:
  application:
    name: rmrs-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 10
      pool-name: rmrs-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_rmrs
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_rmrs
    create-schemas: true           # history table needs ihms_rmrs before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8104}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: rmrs-service
    description: iHMS RMRS & PMRD Treasury service (S24) - Wave-5 tranche 5 (GAP-REGISTER-5 WP-R5); treasury masters (heads/authorities/ledgers), cash collections with receipt uniqueness, BALANCED double-entry postings (SUM(debit)=SUM(credit) per collection, exactly-one-sided entries) in the SAME tx. CollectionPosted is PROPOSED (no consumers) -> NOTHING is written to the outbox; the outbox table exists solely for negative assertions. E-08 PaymentReceived auto-receipt = Wave-5b read-model concern (payment_ref ready).
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
