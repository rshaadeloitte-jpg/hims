spring:
  application:
    name: forms-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ihms}
    username: ${DB_USERNAME:ihms}
    password: ${DB_PASSWORD:ihms-dev-only}
    hikari:
      maximum-pool-size: 10
      pool-name: forms-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_forms
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_forms
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8109}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: forms-service
    description: "iHMS TIU Clinical Forms engine (M40) - dynamic JSON-schema store (versioned), render/submit, top-5 specialty forms seed; owns ihms_forms schema. REST-only."
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
