spring:
  application:
    name: file-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ihms}
    username: ${DB_USERNAME:ihms}
    password: ${DB_PASSWORD:ihms-dev-only}
    hikari:
      maximum-pool-size: 10
      pool-name: file-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_file
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_file
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8095}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: file-service
    description: "iHMS File/Document management service (M34) - document upload/download, category tree, annotated image view; owns ihms_file schema (t_file_category, t_file_details). REST-only - no outbox until file events have a second consumer."
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
