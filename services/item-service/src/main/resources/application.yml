spring:
  application:
    name: item-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ihms}
    username: ${DB_USERNAME:ihms}
    password: ${DB_PASSWORD:ihms-dev-only}
    hikari:
      maximum-pool-size: 10
      pool-name: item-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_item
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_item
    create-schemas: true           # history table needs ihms_item before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  kafka:
    topic:
      item-data-changed: ${ITEM_DATA_CHANGED_TOPIC:ihms.item.master-data-changed}
      stock-movement: ${STOCK_MOVEMENT_TOPIC:ihms.item.stock-movement}
      dlq: ${ITEM_DLQ_TOPIC:dlt.ihms.item.master-data-changed}
  outbox:
    poll-interval-ms: 5000
    max-attempts: 3

info:
  app:
    name: item-service
    description: iHMS Item/Inventory service (S22) - Wave 1 MIG-012, single-writer stock (D-1)
    version: 0.1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
