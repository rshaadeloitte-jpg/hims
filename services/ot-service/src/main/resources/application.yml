spring:
  application:
    name: ot-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 10
      pool-name: ot-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_ot
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_ot
    create-schemas: true           # history table needs ihms_ot before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

app:
  kafka:
    topic:
      ot-events: ${OT_EVENTS_TOPIC:ihms.ot.events}
      dlq: ${OT_DLQ_TOPIC:dlt.ihms.ot.events}
  outbox:
    poll-interval-ms: 5000
    max-attempts: 5

server:
  port: ${SERVER_PORT:8115}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ot-service
    description: iHMS OT & Surgery service (S11) - Wave-3 tranche 3 (Catalog #11); OT schedules + procedure details (BR-OT-001 prerequisite BEOT004 + dependent-surgery discount), lifecycle start/complete/cancel guards (PLANNED/IN_PROGRESS/DONE/CANCELLED), BR-OT-002 pre_billing flag; outbox PROPOSED ProcedureScheduled / SurgeryCompleted
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
