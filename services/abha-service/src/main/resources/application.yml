server:
  port: ${SERVER_PORT:8111}
spring:
  application:
    name: abha-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ihms}
    username: ${DB_USERNAME:ihms}
    password: ${DB_PASSWORD:ihms-dev-only}
    hikari:
      maximum-pool-size: 10
      pool-name: abha-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_abha
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_abha
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true
logging:
  level:
    com.hims: DEBUG
