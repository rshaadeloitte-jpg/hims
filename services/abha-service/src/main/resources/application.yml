server:
  port: ${SERVER_PORT:8111}
spring:
  application:
    name: abha-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 10
      pool-name: abha-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_abha
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_abha
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true
logging:
  level:
    com.hims: DEBUG
