spring:
  application:
    name: interop-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ihms}
    username: ${DB_USERNAME:ihms}
    password: ${DB_PASSWORD:ihms-dev-only}
    hikari:
      maximum-pool-size: 10
      pool-name: interop-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_interop
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_interop
    create-schemas: true           # history table needs ihms_interop before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8105}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  abha:
    enabled: ${ABHA_ENABLED:false} # ponytail: ABHA/HPR/WhatsApp ABDM gateway stub behind flag, enable when sandbox ready

info:
  app:
    name: interop-service
    description: iHMS Interop & Notifications service (Catalog #25) - Wave-6 tranche 6 (GAP-REGISTER-6 WP-T1); HIS outbound/inbound queues, ABDM request queue (correlation-id unique, idempotent callbacks), WhatsApp forward-only status machine, EHR job details. Internal event-relay ingress models the future Kafka consumer. Emits NOTHING - external gateways are contract-stubbed dispatchers (comment-only).
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
