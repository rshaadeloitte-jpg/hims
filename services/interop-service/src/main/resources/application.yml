spring:
  application:
    name: interop-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}?currentSchema=ihms_interop,ihms_govt,ihms_aasmaan,ihms_abha
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 25
      pool-name: interop-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8105}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  abha:
    enabled: ${ABHA_ENABLED:false} # ponytail: ABHA/HPR/WhatsApp ABDM gateway stub behind flag, enable when sandbox ready

info:
  app:
    name: interop-service
    description: iHMS Interop service - bundles interop, govt, aasmaan, abha
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"


ihms:
  security:
    jwt:
      secret: ${IAM_JWT_SECRET:}
