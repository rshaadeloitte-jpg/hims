spring:
  application:
    name: interop-service
  datasource:
    url: jdbc:h2:mem:ihms_interop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS "ihms_interop"\;CREATE SCHEMA IF NOT EXISTS "ihms_govt"\;CREATE SCHEMA IF NOT EXISTS "ihms_aasmaan"\;CREATE SCHEMA IF NOT EXISTS "ihms_abha"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}

server:
  port: 0
