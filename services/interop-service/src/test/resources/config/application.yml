spring:
  test:
    database:
      replace: none
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS "ihms_interop"\;CREATE SCHEMA IF NOT EXISTS "ihms_govt"\;CREATE SCHEMA IF NOT EXISTS "ihms_aasmaan"\;CREATE SCHEMA IF NOT EXISTS "ihms_abha"
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      connection-init-sql: "SET search_path TO ihms_interop,ihms_govt,ihms_aasmaan,ihms_abha"
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: false

ihms:
  security:
    jwt:
      secret: test-only-secret-key-0123456789abcdef0123456789abcdef
