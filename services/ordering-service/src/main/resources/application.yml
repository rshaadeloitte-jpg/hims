spring:
  application:
    name: ordering-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 10
      pool-name: ordering-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_ordering
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_ordering
    create-schemas: true           # history table needs ihms_ordering before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

app:
  kafka:
    topic:
      ordering-events: ${ORDERING_EVENTS_TOPIC:ihms.ordering.events}
      dlq: ${ORDERING_DLQ_TOPIC:dlt.ihms.ordering.events}
  outbox:
    poll-interval-ms: 5000
    max-attempts: 5

server:
  port: ${SERVER_PORT:8097}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ordering-service
    description: iHMS Ordering & Prescription service (S04, MIG-033) - saga replacement of the AddServiceOrder mega-txn; clinical_order+order_item+saga_state written atomically with OrderInitiated via the transactional outbox; downstream Billing/Lab/Rad/Nursing/Pharmacy confirm or fail steps and failures emit OrderFailed in the same tx; prescriptions header+lines with E-06 PrescriptionCreated on create ONLY
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
