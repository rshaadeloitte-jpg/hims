spring:
  application:
    name: ordering-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}?currentSchema=ihms_ordering,ihms_lab,ihms_rad
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 20
      pool-name: ordering-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: false

app:
  eventbus:
    topic:
      ordering-events: ${ORDERING_EVENTS_TOPIC:ihms.ordering.events}
      ordering-dlq: ${ORDERING_DLQ_TOPIC:dlt.ihms.ordering.events}
      lab-events: ${LAB_EVENTS_TOPIC:ihms.lab.events}
      lab-dlq: ${LAB_DLQ_TOPIC:dlt.ihms.lab.events}
  outbox:
    poll-interval-ms: 5000
    max-attempts: 5

server:
  port: ${SERVER_PORT:8097}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: ordering-service
    description: iHMS Ordering service - bundles ordering, lab, radiology
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"

ihms:
  security:
    jwt:
      secret: ${IAM_JWT_SECRET:}
