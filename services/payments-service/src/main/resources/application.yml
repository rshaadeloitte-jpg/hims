spring:
  application:
    name: payments-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 10
      pool-name: payments-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_payment
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_payment
    create-schemas: true           # history table needs ihms_payment before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

app:
  billing:
    # Synchronous settlement target (Catalog #6 dependency "Billing (S/E settlement update)").
    base-url: ${BILLING_BASE_URL:http://localhost:8098}
  kafka:
    topic:
      payment-events: ${PAYMENT_EVENTS_TOPIC:ihms.payment.events}
      dlq: ${PAYMENT_DLQ_TOPIC:dlt.ihms.payment.events}
  outbox:
    poll-interval-ms: 5000
    max-attempts: 5

server:
  port: ${SERVER_PORT:8099}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: payments-service
    description: iHMS Payments and Refunds service (S06) - Wave-4 tranche 4 (Catalog #6); advances (generated balance), payments with mode details, BR-BILL-007 advance FIFO, synchronous REST settlement to billing-service (BR-BILL-006), refunds TransactionType 3/4; outbox E-08 PaymentReceived (payment-received.v1) + E-12 RefundIssued PRELIMINARY (refund-issued.v1), partition key billId
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
