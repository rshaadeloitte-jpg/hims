spring:
  application:
    name: reference-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}?currentSchema=ihms_master,ihms_search,ihms_file
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 20
      pool-name: reference-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

app:
  kafka:
    topic:
      master-data-changed: ${MASTER_DATA_CHANGED_TOPIC:ihms.master.master-data-changed}
      dlq: ${MASTER_DATA_DLQ_TOPIC:dlt.ihms.master.master-data-changed}
  outbox:
    poll-interval-ms: 5000
    max-attempts: 3
  search:
    backend: ${SEARCH_BACKEND:memory}
    live-collections: patient,encounter,item,icd10cm,healthfactor
    solr:
      base-url: ${SOLR_BASE_URL:http://localhost:8983}
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
    patient-qf: ${SEARCH_PATIENT_QF:text_t^1 mrno_s^18 mobile_s^16 civilid_s^16 janaadhar_s^17 name_s^8}

info:
  app:
    name: reference-service
    description: iHMS Reference Master Data service (S21) - Wave 0 seed (slice S0)
    version: 0.1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"


ihms:
  security:
    jwt:
      secret: ${IAM_JWT_SECRET:}
