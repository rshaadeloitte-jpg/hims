spring:
  application:
    name: cssd-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ihms}
    username: ${DB_USERNAME:ihms}
    password: ${DB_PASSWORD:ihms-dev-only}
    hikari:
      maximum-pool-size: 10
      pool-name: cssd-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_cssd
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_cssd
    create-schemas: true           # history table needs ihms_cssd before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8102}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: cssd-service
    description: iHMS CSSD service (Catalog #15) - Wave-5 tranche 5 (GAP-REGISTER-5 WP-R3); kit lifecycle ASSEMBLED -> STERILIZING -> STERILE/REJECTED -> ISSUED (single active issue); KitIssued / SterilizationCompleted REJECTED phase 1 per KAFKA-EVENT-CATALOG - no outbox emission
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
