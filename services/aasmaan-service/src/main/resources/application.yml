spring:
  application:
    name: aasmaan-service
  datasource:
    url: jdbc:h2:mem:aasmaan;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: embedded
server:
  port: ${SERVER_PORT:8112}
