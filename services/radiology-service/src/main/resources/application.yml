spring:
  application:
    name: radiology-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ihms}
    username: ${DB_USERNAME:ihms}
    password: ${DB_PASSWORD:ihms-dev-only}
    hikari:
      maximum-pool-size: 10
      pool-name: radiology-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_rad
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_rad
    create-schemas: true           # history table needs ihms_rad before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8116}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: radiology-service
    description: iHMS Radiology service (Catalog #8) - Wave-5 tranche 5; rad order booking header+lines, modality XRAY/CT/MRI/US, priority 1=routine 2=urgent, status machine SCHEDULED->IN_PROGRESS->COMPLETED / CANCELLED with start/capture-image/report/cancel guards. NO events emitted - RadOrderCreated DEFERRED (KAFKA-EVENT-CATALOG §3)
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
