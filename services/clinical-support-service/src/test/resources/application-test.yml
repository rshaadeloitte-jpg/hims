spring:
  application:
    name: chemotherapy-service
  datasource:
    url: jdbc:h2:mem:ihms_chemotherapy;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_chemotherapy
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_chemotherapy
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 0
