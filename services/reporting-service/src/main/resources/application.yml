spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ihms}
    username: ${DB_USERNAME:ihms}
    password: ${DB_PASSWORD:ihms-dev-only}
    hikari:
      maximum-pool-size: 10
      pool-name: reporting-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_reporting
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_reporting
    create-schemas: true           # history table needs ihms_reporting before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8106}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: reporting-service
    description: iHMS Reporting & Analytics service (Catalog #26) - Wave-5 tranche 6 (GAP-REGISTER-6 WP-T2); rm_* read models fed by internal event ingress with strict idempotency, report master/execute engine, dashboard counts; emits NOTHING
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
