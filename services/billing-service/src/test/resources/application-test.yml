spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS "ihms_rcm"
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_rcm
        globally_quoted_identifiers: true
  flyway:
    enabled: false
    default-schema: ihms_rcm
    create-schemas: true
    locations: classpath:db/migration/rcm
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:29092
