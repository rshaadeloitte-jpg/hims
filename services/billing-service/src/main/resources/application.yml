spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}?currentSchema=ihms_billing,ihms_payment,ihms_rcm
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 20
      pool-name: billing-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: false

app:
  billing:
    base-url: ${BILLING_BASE_URL:http://localhost:8098}
  eventbus:
    topic:
      ordering-events: ${ORDERING_EVENTS_TOPIC:ihms.ordering.events}
      billing-events: ${BILLING_EVENTS_TOPIC:ihms.billing.events}
      billing-dlq: ${BILLING_DLQ_TOPIC:dlt.ihms.billing.events}
      payment-events: ${PAYMENT_EVENTS_TOPIC:ihms.payment.events}
      payment-dlq: ${PAYMENT_DLQ_TOPIC:dlt.ihms.payment.events}
      rcm-events: ${RCM_EVENTS_TOPIC:ihms.rcm.events}
      rcm-dlq: ${RCM_DLQ_TOPIC:dlt.ihms.rcm.events}
    # billing-saga consumer group on ihms_eventbus (replaces the Kafka listener)
    consumer:
      enabled: ${EVENTBUS_CONSUMER_ENABLED:true}
      poll-interval-ms: 1000
      batch-size: 50
      max-attempts: 5
      lock-timeout-seconds: 300
  outbox:
    poll-interval-ms: 5000
    max-attempts: 5

server:
  port: ${SERVER_PORT:8098}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: billing-service
    description: iHMS Billing & Settlement service — bundles payments and rcm
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"

ihms:
  security:
    jwt:
      secret: ${IAM_JWT_SECRET:}
