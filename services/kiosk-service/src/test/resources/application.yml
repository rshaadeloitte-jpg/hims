spring:
  test:
    database:
      replace: none
  datasource:
    url: jdbc:h2:mem:kioskdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS "ihms_kiosk"\;SET SCHEMA "ihms_kiosk"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_schema: ihms_kiosk
        globally_quoted_identifiers: true
  flyway:
    enabled: false
