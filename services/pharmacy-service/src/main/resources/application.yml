spring:
  application:
    name: pharmacy-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}?currentSchema=ihms_pharmacy,ihms_item
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 15
      pool-name: pharmacy-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8101}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: pharmacy-service
    description: iHMS Pharmacy & Dispensing service (S09) - bundles item/inventory service
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"


app:
  item-service:
    base-url: ${ITEM_SERVICE_URL:http://localhost:8082}   # single-writer stock API (D-1)
  pharmacy:
    store-id: ${PHARMACY_STORE_ID:1}                      # pharmacy dispensing store at item-service
  kafka:
    topic:
      item-data-changed: ${ITEM_DATA_CHANGED_TOPIC:ihms.item.master-data-changed}
      stock-movement: ${STOCK_MOVEMENT_TOPIC:ihms.item.stock-movement}
      dlq: ${ITEM_DLQ_TOPIC:dlt.ihms.item.master-data-changed}
  outbox:
    poll-interval-ms: 5000
    max-attempts: 3

ihms:
  security:
    jwt:
      secret: ${IAM_JWT_SECRET:}
