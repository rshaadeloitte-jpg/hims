spring:
  application:
    name: govt-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ihms}
    username: ${DB_USERNAME:ihms}
    password: ${DB_PASSWORD:ihms-dev-only}
    hikari:
      maximum-pool-size: 10
      pool-name: govt-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_govt
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_govt
    create-schemas: true           # history table needs ihms_govt before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8108}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: govt-service
    description: iHMS Govt Programs service (Catalog #28) - Wave-6 tranche 6 (GAP-REGISTER-6 WP-T4); Chiranjeevi enrolment + TID linkage, Aasmaan case management (forward-only status), EJS incentives (recompute replaces COMPUTED only); IncentiveComputed / CaseUpdated DEFERRED - no outbox emission; PCTS / Chiranjeevi-Yojana external pushes OUT OF SCOPE
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
