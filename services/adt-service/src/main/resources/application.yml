spring:
  application:
    name: adt-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ihms}
    username: ${DB_USERNAME:ihms}
    password: ${DB_PASSWORD:ihms-dev-only}
    hikari:
      maximum-pool-size: 10
      pool-name: adt-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_adt
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_adt
    create-schemas: true           # history table needs ihms_adt before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

app:
  kafka:
    topic:
      # MIG-032: single ADT lifecycle stream (PatientAdmitted / PatientDischarged /
      # BedTransferred keyed by patientId; BedStatusChanged keyed by bedId per the
      # KAFKA-EVENT-CATALOG §6 per-bed ordering rule)
      adt-events: ${ADT_EVENTS_TOPIC:ihms.adt.lifecycle}
      dlq: ${ADT_DLQ_TOPIC:dlt.ihms.adt.lifecycle}
  outbox:
    poll-interval-ms: 5000
    max-attempts: 5
  adt:
    # BR-IPD-001 IPD number template A/<prefix>/<yy>/<%05d seq>; seq from t_admission_seq
    ipd-prefix: ${ADT_IPD_PREFIX:IHMS}
  jobs:
    abscond:
      # BR-IPD-005 interim-admission auto-abscond (legacy updateAbscondInterimAdmissionStatusJob)
      enabled: ${ABSCOND_SWEEP_ENABLED:true}
      cron: "${ABSCOND_SWEEP_CRON:0 0 2 * * *}"
      zone: ${ABSCOND_SWEEP_ZONE:Asia/Kolkata}
      older-than-days: ${ABSCOND_OLDER_THAN_DAYS:3}   # exactly 3 days counts (<= boundary)

server:
  port: ${SERVER_PORT:8092}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: adt-service
    description: iHMS ADT & Bed service (S03) - Wave-3 tranche 2 (Catalog #3); ward/bed-status/bed masters, admission (BR-IPD-001/002/003 CAS bed claim + auto-allocation), transfer, discharge (BR-DIS-003); outbox events to ihms.adt.lifecycle (PatientAdmitted/PatientDischarged/BedTransferred/BedStatusChanged)
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
