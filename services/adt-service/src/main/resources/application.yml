spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: adt-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}?currentSchema=ihms_adt,ihms_nursing,ihms_bcma,ihms_ot
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 25
      pool-name: adt-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
        hbm2ddl:
          create_namespaces: true
  flyway:
    enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

app:
  kafka:
    topic:
      # MIG-032: single ADT lifecycle stream (PatientAdmitted / PatientDischarged /
      # BedTransferred keyed by patientId; BedStatusChanged keyed by bedId per the
      # KAFKA-EVENT-CATALOG §6 per-bed ordering rule)
      adt-events: ${ADT_EVENTS_TOPIC:ihms.adt.lifecycle}
      adt-dlq: ${ADT_DLQ_TOPIC:dlt.ihms.adt.lifecycle}
      dlq: ${ADT_DLQ_TOPIC:dlt.ihms.adt.lifecycle}
      # PROPOSED events VitalsRecorded / NurseTaskCompleted
      nursing-events: ${NURSING_EVENTS_TOPIC:ihms.nursing.events}
      nursing-dlq: ${NURSING_DLQ_TOPIC:dlt.ihms.nursing.events}
      # OT events
      ot-events: ${OT_EVENTS_TOPIC:ihms.ot.events}
      ot-dlq: ${OT_DLQ_TOPIC:dlt.ihms.ot.events}
  outbox:
    poll-interval-ms: 5000
    max-attempts: 5
  adt:
    # BR-IPD-001 IPD number template A/<prefix>/<yy>/<%05d seq>; seq from t_admission_seq
    ipd-prefix: ${ADT_IPD_PREFIX:IHMS}
  jobs:
    abscond:
      # BR-IPD-005 interim-admission auto-abscond (legacy updateAbscondInterimAdmissionStatusJob)
      enabled: ${ABSCOND_SWEEP_ENABLED:true}
      cron: "${ABSCOND_SWEEP_CRON:0 0 2 * * *}"
      zone: ${ABSCOND_SWEEP_ZONE:Asia/Kolkata}
      older-than-days: ${ABSCOND_OLDER_THAN_DAYS:3}   # exactly 3 days counts (<= boundary)

server:
  port: ${SERVER_PORT:8092}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: adt-service
    description: iHMS ADT service — bundles adt, nursing, bcma, and ot services
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"


ihms:
  security:
    jwt:
      secret: ${IAM_JWT_SECRET:}
