spring:
  application:
    name: nursing-service
  datasource:
    url: jdbc:h2:mem:ihms_nursing;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_nursing
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_nursing
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}

app:
  kafka:
    topic:
      nursing-events: ${NURSING_EVENTS_TOPIC:ihms.nursing.events}
      dlq: ${NURSING_DLQ_TOPIC:dlt.ihms.nursing.events}
  outbox:
    poll-interval-ms: 5000
    max-attempts: 5

server:
  port: 0
