spring:
  application:
    name: iam-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ihms}
    username: ${DB_USERNAME:ihms}
    password: ${DB_PASSWORD:ihms-dev-only}
    hikari:
      maximum-pool-size: 10
      pool-name: iam-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: ihms_iam
        globally_quoted_identifiers: true
  flyway:
    default-schema: ihms_iam
    create-schemas: true           # history table needs ihms_iam before V1 executes
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# JWT issuer settings — HS256 with SERVER-SIDE secret (Catalog #22 security target:
# no hard-coded keys in prod; secret injected via env). 30-min TTL mirrors the
# legacy Redis session TTL (08 §2.4).
iam:
  jwt:
    secret: ${IAM_JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
    ttl-minutes: ${IAM_JWT_TTL_MINUTES:30}
    issuer: iam-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  otp:
    return-in-response: ${IAM_OTP_RETURN:true} # true in dev (OTP in response), false in prod (via SMS gateway)
  sso:
    enabled: ${IAM_SSO_ENABLED:false} # ponytail: SSO integration behind feature flag, add when IdP ready

info:
  app:
    name: iam-service
    description: iHMS Security & IAM service - Wave 0, auth (JWT HS256), user CRUD, role management, M35 permissions/OTP
    version: 0.1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"
