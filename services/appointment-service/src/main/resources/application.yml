spring:
  application:
    name: appointment-service
  datasource:
    url: jdbc:postgresql://${DEV_DB_HOST:10.68.61.102}:${DEV_DB_PORT:5432}/${DEV_DB_NAME:hims}?currentSchema=ihms_appointment,ihms_queue,ihms_kiosk
    username: ${DEV_DB_USERNAME:postgres}
    password: ${DEV_DB_PASSWORD:TMSProduct1234}
    hikari:
      maximum-pool-size: 20
      pool-name: appointment-cp
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: false

app:
  eventbus:
    topic:
      # MIG-031: single appointment/encounter event stream, patientId-keyed
      # (encounterId for EncounterClosed) per the ordering rule of KAFKA-EVENT-CATALOG §6.
      appointment-encounter: ${APPOINTMENT_ENCOUNTER_TOPIC:ihms.appointment.encounter}
      dlq: ${APPOINTMENT_DLQ_TOPIC:dlt.ihms.appointment.encounter}
  outbox:
    poll-interval-ms: 5000
    max-attempts: 5
  jobs:
    encounter-close:
      enabled: ${ENCOUNTER_CLOSE_ENABLED:true}
      cron: "${ENCOUNTER_CLOSE_CRON:0 30 1 * * *}"

server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: appointment-service
    description: iHMS Appointment & Encounter service (S02) - bundles appointment, queue, kiosk
    version: 0.1.0-SNAPSHOT

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{corr:-}] %logger{36} - %msg%n"

ihms:
  security:
    jwt:
      secret: ${IAM_JWT_SECRET:}
